<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合同谈判台 · Transfer Desk</title>
<style>
:root{color-scheme:light;--ink:#14263e;--paper:#eef2f6;--panel:#ffffff;--line:#9fb1c5;--accent:#e1c49a;--muted:#4d5f73;font:16px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}main{width:min(100% - 2rem,64rem);margin:auto;padding:1.5rem 0 3rem}header{background:var(--ink);color:var(--paper);padding:clamp(1rem,4vw,2.5rem);border-radius:1rem 1rem .2rem .2rem}header div,.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.08;margin:.7rem 0}p{margin:.5rem 0}small{font-size:.85rem}fieldset{margin:1.25rem 0;padding:0;border:0;min-width:0}legend{font-weight:750;margin-bottom:.6rem}.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:12px}.offer{display:block;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1rem}.offer:has(input:checked){border:2px solid var(--ink);padding:calc(1rem - 1px);box-shadow:inset 0 4px var(--accent)}.offer strong{font-size:1.1rem}.offer p{font-variant-numeric:tabular-nums}.terms{color:var(--muted)}.actions{justify-content:flex-start;margin:1rem 0}button,select{min-height:44px;border:1px solid var(--ink);border-radius:.45rem;padding:.5rem .85rem;font:inherit;color:var(--ink);background:var(--panel)}button{cursor:pointer;font-weight:700}.primary{background:var(--accent)}button:active:not(:disabled){filter:brightness(.9)}button:disabled{opacity:.55;cursor:default}:focus-visible{outline:3px solid #2664a5;outline-offset:3px}label{display:inline-block}#result{min-height:3rem;border-left:4px solid var(--ink);padding:.55rem .8rem;background:var(--panel)}footer{color:var(--muted);margin-top:1rem}
</style>
<main>
<header><div><strong>Transfer Desk / 转会桌</strong><button id="lang" type="button" lang="en">English</button></div><h1 id="heading"></h1><p id="brief"></p></header>
<form id="desk"><fieldset><legend id="legend"></legend><div class="offers" id="offers"></div></fieldset>
<label for="raise" id="raise-label"></label> <select id="raise"><option value="0">—</option><option value="1000">+€1,000</option><option value="2000">+€2,000</option></select>
<div class="actions"><button class="primary" id="submit" type="submit"></button><button type="button" id="reset"></button><strong id="budget"></strong></div></form>
<p id="result" role="status" aria-live="polite"></p><footer id="note"></footer>
</main>
<script src="negotiation.js" defer></script><script src="ui.js" defer></script>
</html>
